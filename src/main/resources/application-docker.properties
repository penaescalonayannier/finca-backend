# Server Configuration
server.port=9908
server.servlet.context-path=/
spring.cloud.config.enabled=false

# Spring Application
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet

# OAuth2/Keycloak - using same config as dev
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.chevere.ddns.net/realms/kynsoft
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth.chevere.ddns.net/realms/kynsoft/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.token-uri=https://auth.chevere.ddns.net/realms/kynsoft/protocol/openid-connect/token

# Database - configured via environment variables
spring.jpa.database=default
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Datasource - uses environment variables
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.minimum-idle=2
spring.datasource.maximum-pool-size=10
spring.datasource.hikari.pool-name=WritePool

spring.read-datasource.driverClassName=org.postgresql.Driver
spring.read-datasource.url=${SPRING_READ_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store}
spring.read-datasource.username=${SPRING_READ_DATASOURCE_USERNAME:postgres}
spring.read-datasource.password=${SPRING_READ_DATASOURCE_PASSWORD:postgres}
spring.read-datasource.minimum-idle=2
spring.read-datasource.maximum-pool-size=10
spring.read-datasource.hikari.pool-name=ReadPool

# JWT Auth Configuration
jwt.secret=c2lzdGVtYS1maW5jYS1zZWNyZXQta2V5LXByb2R1Y3Rpb24tMjAyNi1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRz
jwt.expiration=86400000

# CORS Configuration
http.cors-enabled=true
http.cors.allowed-origins=*
http.cors.allowed-methods=*
http.cors.allowed-headers=*
http.cors.allow-credentials=false
http.cors.max-age=3600

# Eureka disabled
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.enabled=true

# Redis for docker
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=6379

# Redisson config for docker
spring.redis.redisson.config=classpath:redisson-docker.yaml

# Logging
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Disable banner
spring.main.banner-mode=off

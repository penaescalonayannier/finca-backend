# Server Configuration
server.port=9908
server.servlet.context-path=/
spring.cloud.config.enabled=false

# Spring Application (optimized for dev)
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet
spring.main.lazy-initialization=true

# Tomcat optimization for dev
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=10
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.chevere.ddns.net/realms/kynsoft
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth.chevere.ddns.net/realms/kynsoft/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.token-uri=https://auth.chevere.ddns.net/realms/kynsoft/protocol/openid-connect/token

#datasource
spring.jpa.database=default
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Hibernate auto-detects PostgreSQL dialect - no need to specify
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Disable schema validation on startup for faster boot
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# Hibernate Batch Processing Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# SQL Logging (disabled for performance - enable when debugging)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/store
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.minimum-idle=2
spring.datasource.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=WritePool
spring.datasource.hikari.connection-test-query=SELECT 1

spring.read-datasource.driverClassName=org.postgresql.Driver
spring.read-datasource.url=jdbc:postgresql://localhost:5432/store
spring.read-datasource.username=postgres
spring.read-datasource.password=postgres
spring.read-datasource.minimum-idle=2
spring.read-datasource.maximum-pool-size=5
spring.read-datasource.hikari.connection-timeout=30000
spring.read-datasource.hikari.idle-timeout=600000
spring.read-datasource.hikari.max-lifetime=1800000
spring.read-datasource.hikari.auto-commit=true
spring.read-datasource.hikari.pool-name=ReadPool
spring.read-datasource.hikari.connection-test-query=SELECT 1

# JWT Auth Converter Configuration
jwt.auth.converter.resource-id=medinec
jwt.auth.converter.principle-attribute=preferred_username

# HTTP and CORS Configuration
http.cors-enabled=true
http.cors.allowed-origins=http://localhost:8080,http://localhost:5173,https://medinec-admin.kynsoft.net
http.cors.allowed-methods=*
http.cors.allowed-headers=*
http.cors.exposed-headers=*
http.cors.allow-credentials=true
http.cors.max-age=3600

# Eureka Client Configuration (disabled for local dev)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.gateway.discovery.locator.enabled=false

# Springdoc Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html

# Management Endpoints Configuration (minimal for dev)
management.endpoints.web.exposure.include=health
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Disable tracing/telemetry for dev
management.tracing.enabled=false
management.metrics.export.prometheus.enabled=false

#Payment
payment.service.host=payment
payment.service.client-id=669ed63c-5af0-4afc-a45c-9f1369f58cfb
payment.service.expiration=15
payment.service.port=8080

#S3 File Configuration (use environment variables for security)
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.bucketName=medinec
aws.region=us-east-2
aws.cloudfront.domain=http://d2cebw6tssfqem.cloudfront.net/
spring.datasource.initialization-mode=always

# HTTP Client Timeout Configuration (optimized for dev)
http.client.connect-timeout=10000
http.client.socket-timeout=30000
http.client.connection-pool.max-total=20
http.client.connection-pool.max-per-route=5

# Jackson Serialization Optimization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Guayaquil
spring.jackson.default-property-inclusion=non_null

# Async Configuration (optimized for dev)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=ReportExecutor-

# Scheduling Configuration (optimized for dev)
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=ReportScheduler-

# Redis Configuration (optimized for dev)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.max-active=4

# Redisson threads (optimized for dev)
redisson.threads=4
redisson.nettyThreads=4

# Logging optimization
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.io.netty=WARN
logging.level.io.lettuce=WARN
logging.level.org.redisson=WARN
logging.level.org.apache=WARN
logging.level.io.micrometer=WARN
logging.level.com.zaxxer.hikari=WARN

# Disable banner for faster startup
spring.main.banner-mode=off

# JMX disabled for dev
spring.jmx.enabled=false
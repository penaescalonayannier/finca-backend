# Server Configuration
server.port=9908
server.servlet.context-path=/
spring.cloud.config.enabled=false
# Spring Application
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.chevere.ddns.net/realms/kynsoft
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth.chevere.ddns.net/realms/kynsoft/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.token-uri=https://auth.chevere.ddns.net/realms/kynsoft/protocol/openid-connect/token

#datasource
spring.jpa.database=default
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#Esta es la propiedad encargada de generar el esquema de BD.
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Hibernate Batch Processing Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# SQL Logging (instead of show-sql)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/store
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.minimum-idle=10
spring.datasource.maximum-pool-size=25
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=WritePool
spring.datasource.hikari.connection-test-query=SELECT 1

spring.read-datasource.driverClassName=org.postgresql.Driver
spring.read-datasource.url=jdbc:postgresql://localhost:5432/store
spring.read-datasource.username=postgres
spring.read-datasource.password=postgres
spring.read-datasource.minimum-idle=10
spring.read-datasource.maximum-pool-size=25
spring.read-datasource.hikari.connection-timeout=30000
spring.read-datasource.hikari.idle-timeout=600000
spring.read-datasource.hikari.max-lifetime=1800000
spring.read-datasource.hikari.auto-commit=true
spring.read-datasource.hikari.pool-name=ReadPool
spring.read-datasource.hikari.connection-test-query=SELECT 1

# JWT Auth Converter Configuration
jwt.auth.converter.resource-id=medinec
jwt.auth.converter.principle-attribute=preferred_username

# HTTP and CORS Configuration
http.cors-enabled=true
http.cors.allowed-origins=http://localhost:8080,http://localhost:5173,https://medinec-admin.kynsoft.net
http.cors.allowed-methods=*
http.cors.allowed-headers=*
http.cors.exposed-headers=*
http.cors.allow-credentials=true
http.cors.max-age=3600

# Eureka Client Configuration
eureka.instance.hostname=registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.preferIpAddress=true
spring.cloud.gateway.discovery.locator.enabled=true

# Springdoc Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html

# Management Endpoints Configuration
management.endpoints.web.exposure.include=openapi,swagger-ui

#Payment
payment.service.host=payment
payment.service.client-id=669ed63c-5af0-4afc-a45c-9f1369f58cfb
payment.service.expiration=15
payment.service.port=8080

#S3 File Configuration (use environment variables for security)
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.bucketName=medinec
aws.region=us-east-2
aws.cloudfront.domain=http://d2cebw6tssfqem.cloudfront.net/
spring.datasource.initialization-mode=always

# HTTP Client Timeout Configuration
http.client.connect-timeout=10000
http.client.socket-timeout=30000
http.client.connection-pool.max-total=200
http.client.connection-pool.max-per-route=50

# Jackson Serialization Optimization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Guayaquil
spring.jackson.default-property-inclusion=non_null

# Async Configuration
spring.task.execution.pool.core-size=12
spring.task.execution.pool.max-size=24
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ReportExecutor-

# Scheduling Configuration
spring.task.scheduling.pool.size=12
spring.task.scheduling.thread-name-prefix=ReportScheduler-